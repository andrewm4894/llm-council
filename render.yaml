services:
  # Backend API
  - type: web
    name: llm-council-api
    runtime: python
    buildCommand: pip install uv && uv sync
    startCommand: uv run python -m backend.main
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false  # Set in Render dashboard
      - key: POSTHOG_API_KEY
        sync: false  # Optional: Set in Render dashboard for LLM analytics
      - key: POSTHOG_HOST
        value: https://us.i.posthog.com  # Or https://eu.i.posthog.com for EU
      - key: CORS_ORIGINS
        value: https://llm-council-uc3k.onrender.com  # <-- Update to your frontend URL

  # Frontend static site
  - type: web
    name: llm-council
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://llm-council-api.onrender.com  # <-- Update to your backend URL
